[versions]
jline = "4.6.0"

[libraries]
findbugs = { module = "com.google.code.findbugs:jsr305", version = "3.0.2" }
jetbrainsAnnotations = { module = "org.jetbrains:annotations", version = "26.1.0" }
lombok = { module = "org.projectlombok:lombok", version = "1.18.48" }
jcommander = { module = "org.jcommander:jcommander", version = "3.0" }
noteBlockRenderer = { module = "net.raphimc:note-block-renderer", version = "1.0.0-20261113.201234-11" }

jlineReader = { module = "org.jline:jline-reader", version.ref = "jline" }
jlineTerminalJni = { module = "org.jline:jline-terminal-jni", version.ref = "jline" }

junit-bom = { module = "org.junit:junit-bom", version = "6.1.3" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[bundles]
jline = ["jlineReader", "jlineTerminalJni"]

[plugins]
classTokenReplacer = { id = "net.raphimc.class-token-replacer", version = "1.1.7" }
